<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="글로벌 보안 뉴스와 CVE 취약점 정보를 자동 수집하고 한국어로 번역하여 제공합니다.">
    <title>{% block title %}Security News KR{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 800: '#1a1a2e', 900: '#0f0f23', 700: '#16213e' }
                    }
                }
            }
        }
    </script>
    <style>
        .severity-critical { color: #ef4444; background: rgba(239,68,68,0.1); border-color: #ef4444; }
        .severity-high { color: #f97316; background: rgba(249,115,22,0.1); border-color: #f97316; }
        .severity-medium { color: #eab308; background: rgba(234,179,8,0.1); border-color: #eab308; }
        .severity-low { color: #22c55e; background: rgba(34,197,94,0.1); border-color: #22c55e; }
        .severity-unknown { color: #6b7280; background: rgba(107,114,128,0.1); border-color: #6b7280; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4 md:space-x-8 min-w-0">
                    <a href="/" class="text-lg md:text-xl font-bold text-emerald-400 whitespace-nowrap">
                        <span class="text-xl md:text-2xl">&#128737;</span> <span class="hidden sm:inline">Security News KR</span><span class="sm:hidden">SNK</span>
                    </a>
                    <div class="hidden md:flex space-x-4">
                        <a href="/" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-800 hover:text-emerald-400 transition">Dashboard</a>
                        <a href="/news" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-800 hover:text-emerald-400 transition">News</a>
                        <a href="/cves" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-800 hover:text-emerald-400 transition">CVE</a>
                        <a href="/kev" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-800 text-red-400 hover:text-red-300 transition">KEV</a>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <form action="/search" method="get" class="hidden md:flex">
                        <input type="text" name="q" placeholder="Search..." value="{{ request.query_params.get('q', '') }}"
                               class="w-48 lg:w-64 px-3 py-1.5 bg-gray-800 border border-gray-700 rounded-md text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition">
                    </form>
                    <button onclick="toggleDark()" class="p-2 rounded-md hover:bg-gray-800 transition" title="Toggle theme">
                        <span id="theme-icon">&#9790;</span>
                    </button>
                    <button onclick="triggerSync(this)" class="text-xs px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 rounded-md transition" id="sync-btn">Sync</button>
                </div>
            </div>
        </div>
        <!-- Mobile nav -->
        <div class="md:hidden border-t border-gray-800">
            <div class="px-3 py-2">
                <form action="/search" method="get">
                    <input type="text" name="q" placeholder="Search..." value="{{ request.query_params.get('q', '') }}"
                           class="w-full px-3 py-1.5 bg-gray-800 border border-gray-700 rounded-md text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition">
                </form>
            </div>
            <div class="px-2 py-1.5 flex justify-around">
                <a href="/" class="flex-1 text-center px-2 py-1.5 text-xs font-medium rounded hover:bg-gray-800 hover:text-emerald-400 transition">Dashboard</a>
                <a href="/news" class="flex-1 text-center px-2 py-1.5 text-xs font-medium rounded hover:bg-gray-800 hover:text-emerald-400 transition">News</a>
                <a href="/cves" class="flex-1 text-center px-2 py-1.5 text-xs font-medium rounded hover:bg-gray-800 hover:text-emerald-400 transition">CVE</a>
                <a href="/kev" class="flex-1 text-center px-2 py-1.5 text-xs font-medium rounded hover:bg-gray-800 text-red-400 hover:text-red-300 transition">KEV</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 mt-12 py-6 text-center text-gray-500 text-sm">
        <p>Security News KR &mdash; NVD, CISA KEV, GitHub Advisory, RSS</p>
    </footer>

    <script>
        function toggleDark() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            icon.textContent = document.documentElement.classList.contains('dark') ? '\u263E' : '\u2600';
        }
        async function triggerSync(btn) {
            btn.disabled = true;
            btn.textContent = 'Syncing...';
            btn.classList.add('opacity-50');
            try {
                const resp = await fetch('/api/collect');
                const data = await resp.json();
                btn.textContent = data.status === 'collection started' ? 'Started!' : data.message || 'Error';
            } catch(e) {
                btn.textContent = 'Error';
            }
            setTimeout(() => {
                btn.textContent = 'Sync';
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }, 3000);
        }
    </script>
</body>
</html>
